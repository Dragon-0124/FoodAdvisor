<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 재설정</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js" defer></script>
</head>
<body>
<main class="card">
    <h1>비밀번호 재설정</h1>

    <form id="resetPasswordForm">
        <div class="form-group">
            <label for="resetEmail">아이디(이메일)</label>
            <input id="resetEmail" type="email" required>
        </div>

        <div class="form-group">
            <label for="resetQuestion">본인 확인 질문</label>
            <select id="resetQuestion" required>
                <option value="">질문 선택</option>
                <option value="childhood_nickname">어릴 때 별명은?</option>
                <option value="first_school">처음 다닌 학교 이름은?</option>
                <option value="favorite_food">좋아하는 음식은?</option>
            </select>
        </div>

        <div class="form-group">
            <label for="resetAnswer">답변</label>
            <input id="resetAnswer" type="text" autocomplete="off" required>
        </div>

        <div class="form-group">
            <label for="newPassword">새 비밀번호</label>
            <input id="newPassword" type="password" minlength="8"
                   autocomplete="new-password" required>
        </div>

        <div class="form-group">
            <label for="newPasswordConfirm">새 비밀번호 확인</label>
            <input id="newPasswordConfirm" type="password" minlength="8"
                   autocomplete="new-password" required>
        </div>

        <button type="submit">새 비밀번호 저장</button>
        <p class="message" id="resetPasswordMessage" role="status"></p>
    </form>

    <div class="link-row">
        <a href="login.html">로그인으로 돌아가기</a>
    </div>
</main>
</body>
</html>
