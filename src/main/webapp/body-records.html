<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>측정 기록 | FoodAdvisor</title>
    <style>
        :root { color-scheme: light; --purple:#4b2a75; --text:#17151b; --muted:#85818a; --line:#e9e7eb; --soft:#f1eef6; }
        * { box-sizing:border-box; }
        body { margin:0; background:#f3f3f5; color:var(--text); font-family:"Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
        .page { width:min(760px,100%); min-height:100vh; margin:0 auto; padding:24px 22px 48px; background:#fff; }
        .page-header { display:flex; align-items:center; gap:14px; margin-bottom:20px; }
        .back-link { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; color:#222; text-decoration:none; font-size:30px; line-height:1; }
        .back-link:focus-visible { outline:2px solid #bba0df; outline-offset:2px; }
        .page-header h1 { margin:0; font-size:23px; }

        /* 연도 이동 (영양정보·자세히 보기 화면과 같은 모양) */
        .year-bar { position:relative; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
        .year-summary { color:#5c566a; font-size:14px; }
        .year-summary strong { color:var(--purple); }
        .period-nav { display:flex; align-items:center; gap:8px; }
        .period-nav > button { width:34px; height:34px; border:1px solid var(--line); border-radius:50%; background:#fff; color:var(--purple); font-size:20px; line-height:1; cursor:pointer; }
        .period-nav > button:disabled { color:#cfcbd4; cursor:default; }
        .period-nav > button:focus-visible { outline:2px solid #bba0df; outline-offset:2px; }
        .period-nav .period-label { width:auto; min-width:100px; height:34px; padding:0 12px; border:0; border-radius:10px; background:transparent; color:var(--text); font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
        .period-nav .period-label::after { content:"▾"; margin-left:6px; color:#8a8590; font-size:12px; }
        .period-nav .period-label:hover, .period-nav .period-label[aria-expanded="true"] { background:var(--soft); }
        .picker { position:absolute; top:calc(100% + 8px); right:0; z-index:20; width:320px; padding:14px; border:1px solid var(--line); border-radius:16px; background:#fff; box-shadow:0 12px 32px rgba(40,20,70,.16); }
        .picker-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font-size:15px; font-weight:700; }
        .picker-head button { width:30px; height:30px; border:1px solid var(--line); border-radius:50%; background:#fff; color:var(--purple); font-size:18px; line-height:1; cursor:pointer; }
        .picker-head button:disabled { color:#cfcbd4; cursor:default; }
        .box-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
        .box-grid button { position:relative; height:48px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--text); font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
        .box-grid button:hover:not(:disabled) { border-color:#bba0df; background:#faf8fd; }
        .box-grid button.selected { border-color:var(--purple); background:var(--purple); color:#fff; }
        .box-grid button:disabled { background:#fafafa; color:#d0ccd5; cursor:default; }
        .box-grid button.has-record::after { content:""; position:absolute; bottom:6px; left:50%; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:#20b978; }
        .box-grid button.selected.has-record::after { background:#fff; }
        .picker-note { margin:10px 2px 0; color:var(--muted); font-size:12px; }

        /* 연간 요약 카드 */
        .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:22px; }
        .stat-card { display:flex; flex-direction:column; gap:4px; padding:16px 18px; border-radius:16px; background:#f7f4fd; }
        .stat-label { color:#746b82; font-size:13px; font-weight:700; }
        .stat-value { color:#2f2445; font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; }
        .stat-value small { margin-left:3px; color:#827790; font-size:14px; font-weight:600; }
        .stat-value.muted { color:#b3afb7; font-size:16px; font-weight:600; }
        .stat-line { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; }
        .stat-sub { color:#827790; font-size:12px; }
        .change { font-size:13px; font-weight:700; white-space:nowrap; }
        .change.down { color:#2f7a57; }
        .change.up { color:#c0612f; }
        .change.flat { color:#9b97a0; font-weight:600; }

        /* 달마다 접고 펼치는 카드 */
        .month-list { display:grid; gap:10px; }
        .month-card { border:1px solid var(--line); border-radius:16px; background:#fff; overflow:hidden; }
        .month-card[open] { border-color:#d9c9f2; box-shadow:0 6px 18px rgba(90,55,140,.08); }
        .month-head { display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px; padding:14px 18px; cursor:pointer; list-style:none; }
        .month-head::-webkit-details-marker { display:none; }
        .month-head:hover { background:#faf8fd; }
        .month-head:focus-visible { outline:2px solid #bba0df; outline-offset:-2px; }
        .month-title { display:flex; align-items:baseline; gap:8px; min-width:92px; }
        .month-title strong { font-size:18px; }
        .month-title::before { content:"›"; display:inline-block; width:12px; color:#8a8590; font-size:18px; transition:transform .15s ease; }
        .month-card[open] .month-title::before { transform:rotate(90deg); }
        .month-count { color:var(--muted); font-size:13px; }
        .month-metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px 18px; flex:1; min-width:0; }
        .month-metric { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 6px; }
        .metric-label { width:100%; color:#9b97a0; font-size:11px; }
        .metric-value { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
        .metric-value small { margin-left:2px; color:#9b97a0; font-size:11px; font-weight:500; }
        .day-table { width:100%; border-collapse:collapse; font-size:14px; border-top:1px solid var(--line); }
        .day-table th, .day-table td { padding:9px 18px; text-align:left; white-space:nowrap; }
        .day-table th { background:#faf9fc; color:#8a8590; font-size:12px; font-weight:600; }
        .day-table tbody tr:nth-child(even) { background:#fcfbfe; }
        .day-table td.num { font-variant-numeric:tabular-nums; }
        .day-table td.empty-value { color:#cfcbd4; }
        .day-table td.action-cell { text-align:right; }
        .delete-button { padding:4px 10px; border:1px solid #f1c9c4; border-radius:8px; background:#fff5f4; color:#c0473a; font:inherit; font-size:12px; font-weight:600; cursor:pointer; }
        .delete-button:hover { background:#ffe9e6; }
        .empty { padding:28px; border:1px dashed var(--line); border-radius:16px; color:var(--muted); text-align:center; font-size:14px; }

        @media (min-width:1025px) { .page { width:min(1200px,100%); padding:32px 48px 56px; } }
        @media (max-width:640px) {
            .page { padding:20px 18px 36px; }
            .page-header h1 { font-size:21px; }
            .picker { left:0; right:0; width:auto; }
            .stats { grid-template-columns:1fr; gap:8px; }
            .stat-card { display:grid; grid-template-columns:auto 1fr; align-items:center; gap:2px 12px; padding:12px 14px; }
            .stat-card .stat-label { grid-row:span 3; min-width:58px; }
            .stat-value { font-size:20px; }
            .month-head { padding:12px 14px; }
            .month-metrics { gap:6px 10px; }
            .metric-value { font-size:15px; }
            .day-table th, .day-table td { padding:8px 6px; font-size:13px; }
            .day-table th:first-child, .day-table td:first-child { padding-left:14px; }
            .day-table td.action-cell { padding-right:10px; }
        }
    </style>
</head>
<body>
<main class="page">
    <header class="page-header">
        <a class="back-link" href="weight-tracker.html" aria-label="신체 변화 기록으로 돌아가기">‹</a>
        <h1>측정 기록</h1>
    </header>

    <div class="year-bar">
        <p class="year-summary" id="yearSummary"></p>
        <div class="period-nav">
            <button type="button" id="prevYear" aria-label="이전 해">‹</button>
            <button type="button" class="period-label" id="yearLabel" aria-haspopup="dialog" aria-expanded="false" aria-controls="picker"></button>
            <button type="button" id="nextYear" aria-label="다음 해">›</button>
        </div>
        <div class="picker" id="picker" role="dialog" aria-label="연도 선택" hidden></div>
    </div>

    <section class="stats" id="yearStats" aria-label="연간 요약"></section>
    <div class="month-list" id="monthList"></div>
    <div class="empty" id="emptyMessage" hidden>이 해에 측정 기록이 없습니다.</div>
</main>
<script src="js/api.js"></script>
<script src="js/data-adapter.js"></script>
<script>
(() => {
    const api = window.FoodAdvisorApi;
    const appData = window.FoodAdvisorData;
    const thisYear = new Date().getFullYear();
    const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

    const yearParam = Number(new URLSearchParams(location.search).get("year"));
    let viewYear = yearParam >= 1900 && yearParam <= thisYear ? yearParam : thisYear;
    let records = [];  // 날짜 내림차순

    const fmt = value => value === null || value === undefined ? "-" : Number(value).toFixed(1);

    const METRICS = [
        { key: "weight", label: "체중", unit: "kg" },
        { key: "muscle", label: "골격근량", unit: "kg" },
        { key: "bodyFat", label: "체지방률", unit: "%" }
    ];
    const avgOf = (rows, key) => {
        const values = rows.map(r => r[key]).filter(v => v !== null && v !== undefined);
        return values.length ? values.reduce((a, b) => a + b, 0) / values.length : null;
    };
    // 변화 표시: 줄면 초록(▼), 늘면 주황(▲)
    function changeSpan(diff, unit) {
        const span = document.createElement("span");
        if (diff === null || Math.abs(diff) < 0.05) {
            span.className = "change flat";
            span.textContent = diff === null ? "" : `±0${unit}`;
            return span;
        }
        span.className = `change ${diff < 0 ? "down" : "up"}`;
        span.textContent = `${diff < 0 ? "▼" : "▲"} ${Math.abs(diff).toFixed(1)}${unit}`;
        return span;
    }
    const el = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
    };

    // 연간 요약: 항목마다 첫 측정 → 마지막 측정, 변화, 평균
    function renderSummary(rows) {
        const box = document.getElementById("yearStats");
        const asc = [...rows].reverse();
        box.replaceChildren(...METRICS.map(({ key, label, unit }) => {
            const card = el("div", "stat-card");
            const measured = asc.filter(r => r[key] !== null && r[key] !== undefined);
            card.append(el("span", "stat-label", label));
            if (!measured.length) {
                card.append(el("strong", "stat-value muted", "기록 없음"));
                return card;
            }
            const first = measured[0];
            const last = measured[measured.length - 1];
            const value = el("strong", "stat-value", `${fmt(last[key])}`);
            value.append(el("small", "", unit));
            card.append(value);
            const line = el("div", "stat-line");
            line.append(changeSpan(measured.length > 1 ? last[key] - first[key] : null, unit));
            line.append(el("span", "stat-sub", `${Number(first.date.slice(5, 7))}/${Number(first.date.slice(8, 10))} ${fmt(first[key])} → ${Number(last.date.slice(5, 7))}/${Number(last.date.slice(8, 10))}`));
            card.append(line);
            card.append(el("span", "stat-sub", `평균 ${fmt(avgOf(measured, key))}${unit} · ${measured.length}회`));
            return card;
        }));
    }

    function render() {
        document.getElementById("yearLabel").textContent = `${viewYear}년`;
        document.getElementById("nextYear").disabled = viewYear >= thisYear;
        document.getElementById("prevYear").disabled = !records.some(r => Number(r.date.slice(0, 4)) < viewYear);
        history.replaceState(null, "", `?year=${viewYear}`);

        const rows = records.filter(r => r.date.startsWith(`${viewYear}-`));
        const summary = document.getElementById("yearSummary");
        summary.replaceChildren(`${viewYear}년 측정 `, el("strong", "", `${rows.length}회`), ` · 전체 ${records.length.toLocaleString()}회`);
        renderSummary(rows);

        // 달마다 접었다 펼 수 있는 카드: 제목 줄에 그 달 평균과 전달 대비 변화, 펼치면 날짜별 기록
        const months = [];
        rows.forEach(record => {
            const month = Number(record.date.slice(5, 7));
            if (!months.length || months[months.length - 1].month !== month) months.push({ month, rows: [] });
            months[months.length - 1].rows.push(record);
        });
        const list = document.getElementById("monthList");
        // 같은 해를 다시 그릴 때(삭제 후)는 펼쳐 둔 달을 그대로 유지
        const keepOpen = list.dataset.year === String(viewYear)
            ? new Set([...list.querySelectorAll(".month-card[open]")].map(card => card.dataset.month)) : null;
        list.dataset.year = String(viewYear);
        document.getElementById("emptyMessage").hidden = rows.length > 0;
        list.replaceChildren(...months.map((group, index) => {
            const details = el("details", "month-card");
            details.dataset.month = String(group.month);
            details.open = keepOpen ? keepOpen.has(String(group.month)) : index === 0;  // 처음에는 가장 최근 달만 펼침
            const head = el("summary", "month-head");
            const title = el("div", "month-title");
            title.append(el("strong", "", `${group.month}월`), el("span", "month-count", `${group.rows.length}회`));
            head.append(title);

            const prev = months[index + 1];  // 바로 앞 달 (목록은 최신순)
            const metrics = el("div", "month-metrics");
            METRICS.forEach(({ key, label, unit }) => {
                const avg = avgOf(group.rows, key);
                const item = el("div", "month-metric");
                item.append(el("span", "metric-label", label));
                const value = el("span", "metric-value", avg === null ? "-" : fmt(avg));
                if (avg !== null) value.append(el("small", "", unit));
                item.append(value);
                const prevAvg = prev ? avgOf(prev.rows, key) : null;
                if (avg !== null && prevAvg !== null) item.append(changeSpan(avg - prevAvg, unit));
                metrics.append(item);
            });
            head.append(metrics);
            details.append(head);

            const table = el("table", "day-table");
            const thead = el("thead");
            const headRow = el("tr");
            ["날짜", "체중", "골격근량", "체지방률", ""].forEach(text => headRow.append(el("th", "", text)));
            thead.append(headRow);
            const tbody = el("tbody");
            group.rows.forEach(record => {
                const tr = el("tr");
                const [, m, d] = record.date.split("-").map(Number);
                const weekday = WEEKDAYS[new Date(viewYear, m - 1, d).getDay()];
                tr.append(el("td", "date-cell", `${m}/${d} (${weekday})`));
                METRICS.forEach(({ key }) => {
                    const value = record[key];
                    tr.append(el("td", value === null || value === undefined ? "num empty-value" : "num", fmt(value)));
                });
                const action = el("td", "action-cell");
                const button = el("button", "delete-button", "삭제");
                button.type = "button";
                button.setAttribute("aria-label", `${record.date} 기록 삭제`);
                button.addEventListener("click", () => deleteRecord(record.date));
                action.append(button);
                tr.append(action);
                tbody.append(tr);
            });
            table.append(thead, tbody);
            details.append(table);
            return details;
        }));
    }

    async function deleteRecord(date) {
        if (!confirm(`${date} 측정 기록을 삭제할까요?`)) return;
        try {
            await appData.deleteBodyMetric(date);
        } catch (error) {
            api.handleError(error, "기록을 삭제하지 못했습니다.");
            return;
        }
        records = records.filter(r => r.date !== date);
        render();
    }

    // ---------- 연도 선택 팝업: 12년 칸 (기록 있는 해는 초록 점) ----------
    const picker = document.getElementById("picker");
    const labelButton = document.getElementById("yearLabel");
    let cursor;

    function renderPicker() {
        const head = document.createElement("div");
        head.className = "picker-head";
        const prev = document.createElement("button");
        prev.type = "button";
        prev.textContent = "‹";
        prev.setAttribute("aria-label", "이전 12년");
        const title = document.createElement("span");
        title.textContent = `${cursor}년 ~ ${cursor + 11}년`;
        const next = document.createElement("button");
        next.type = "button";
        next.textContent = "›";
        next.setAttribute("aria-label", "다음 12년");
        next.disabled = cursor + 11 >= thisYear;
        prev.addEventListener("click", () => { cursor -= 12; renderPicker(); });
        next.addEventListener("click", () => { cursor += 12; renderPicker(); });
        head.append(prev, title, next);

        const grid = document.createElement("div");
        grid.className = "box-grid";
        for (let year = cursor; year < cursor + 12; year++) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = `${year}년`;
            button.disabled = year > thisYear;
            button.classList.toggle("selected", year === viewYear);
            button.classList.toggle("has-record", records.some(r => r.date.startsWith(`${year}-`)));
            button.addEventListener("click", () => { viewYear = year; closePicker(); render(); });
            grid.appendChild(button);
        }
        const note = document.createElement("p");
        note.className = "picker-note";
        note.textContent = "초록 점: 측정 기록이 있는 해";
        picker.replaceChildren(head, grid, note);
    }
    function openPicker() {
        cursor = viewYear - (viewYear % 12);
        renderPicker();
        picker.hidden = false;
        labelButton.setAttribute("aria-expanded", "true");
    }
    function closePicker() {
        picker.hidden = true;
        labelButton.setAttribute("aria-expanded", "false");
    }

    labelButton.addEventListener("click", () => (picker.hidden ? openPicker() : closePicker()));
    // 팝업 안 클릭은 바깥 클릭으로 보지 않음 (‹ › 를 누르면 내용이 다시 그려지기 때문)
    picker.addEventListener("click", event => event.stopPropagation());
    document.addEventListener("click", event => {
        if (!picker.hidden && event.target !== labelButton) closePicker();
    });
    document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !picker.hidden) {
            closePicker();
            labelButton.focus();
        }
    });
    document.getElementById("prevYear").addEventListener("click", () => { closePicker(); viewYear -= 1; render(); });
    document.getElementById("nextYear").addEventListener("click", () => { closePicker(); viewYear += 1; render(); });

    (async () => {
        if (!await api.requireLogin()) return;
        try {
            records = (await appData.getBodyMetrics())
                .filter(r => r.weight !== null || r.muscle !== null || r.bodyFat !== null)
                .sort((a, b) => b.date.localeCompare(a.date));
        } catch (error) {
            api.handleError(error, "측정 기록을 불러오지 못했습니다.");
            return;
        }
        render();
    })();
})();
</script>
</body>
</html>
