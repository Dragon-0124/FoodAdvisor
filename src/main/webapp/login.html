<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js" defer></script>

    <style id="foodadvisor-violet-theme">
      :root{--violet:#7856d8;--violet-dark:#6240c2;--lavender:#f0eaff;--page:#f7f5fc;--ink:#29243a;--muted:#827d91;--stroke:#ece8f5}
      body{background:var(--page)!important;color:var(--ink)!important;font-family:Inter,"Pretendard","Noto Sans KR",system-ui,-apple-system,sans-serif!important}
      .container,.main-container{max-width:1120px}
      .week-card,.panel,.meal-card,.chart-card,.user-card,.diet-card,.stat-card,.summary-card{border:1px solid var(--stroke)!important;border-radius:22px!important;background:#fff!important;box-shadow:0 10px 30px rgba(70,48,120,.06)!important}
      .topbar h1,h1,h2,h3{color:var(--ink);letter-spacing:-.035em}
      button,.link-button,.primary-button{border-radius:13px!important;transition:transform .16s,box-shadow .16s,background .16s}
      .primary-button,button.primary-button,button[type=submit],.weight-link{background:linear-gradient(135deg,#8564e7,#6d4bd0)!important;color:#fff!important;box-shadow:0 7px 17px rgba(109,75,208,.18)}
      .primary-button:hover,.weight-link:hover,button[type=submit]:hover{background:#6240c2!important;transform:translateY(-1px)}
      .secondary-button{background:#f1edfa!important;color:#5d4a8f!important}
      input,select,textarea{border:1px solid #e5def2!important;border-radius:12px!important;background:#fcfbff!important;color:var(--ink)!important}
      input:focus,select:focus,textarea:focus{outline:none;border-color:#8a6be2!important;box-shadow:0 0 0 4px rgba(120,86,216,.13)!important}
      a{color:#6d4bd0}
      .week-day.active,.active,.selected{background:#7856d8!important;color:#fff!important;border-color:#7856d8!important}
      .highlight{background:#f0eaff!important;color:#6240c2!important}
      .user-stat{border-color:#ece8f5!important}
      table th{background:#f7f4fd!important;color:#675c80!important}
      @media(max-width:650px){body{padding:14px!important}.topbar{align-items:flex-start;flex-wrap:wrap}.top-actions{flex-wrap:wrap}}
    </style>

</head>
<body>
<main class="card">
    <h1>로그인</h1>

    <form id="loginForm">
        <div class="form-group">
            <label for="loginEmail">아이디(이메일)</label>
            <input id="loginEmail" type="email" autocomplete="username" required>
        </div>

        <div class="form-group">
            <label for="loginPassword">비밀번호</label>
            <input id="loginPassword" type="password"
                   autocomplete="current-password" required>
        </div>

        <button type="submit">로그인</button>
        <p class="message" id="loginMessage" role="status"></p>
    </form>

    <div class="link-row">
        <a href="signup.html">회원가입</a>
        <a href="find-id.html">아이디 찾기</a>
        <a href="reset-password.html">비밀번호 재설정</a>
    </div>
</main>
    <script src="js/ui-effects.js" defer></script>
</body>
</html>
