<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js" defer></script>

    <style id="foodadvisor-violet-theme">
      :root{--violet:#7856d8;--violet-dark:#6240c2;--lavender:#f0eaff;--page:#f7f5fc;--ink:#29243a;--muted:#827d91;--stroke:#ece8f5}
      body{background:var(--page)!important;color:var(--ink)!important;font-family:Inter,"Pretendard","Noto Sans KR",system-ui,-apple-system,sans-serif!important}
      .container,.main-container{max-width:1120px}
      .week-card,.panel,.meal-card,.chart-card,.user-card,.diet-card,.stat-card,.summary-card{border:1px solid var(--stroke)!important;border-radius:22px!important;background:#fff!important;box-shadow:0 10px 30px rgba(70,48,120,.06)!important}
      .topbar h1,h1,h2,h3{color:var(--ink);letter-spacing:-.035em}
      button,.link-button,.primary-button{border-radius:13px!important;transition:transform .16s,box-shadow .16s,background .16s}
      .primary-button,button.primary-button,button[type=submit],.weight-link{background:linear-gradient(135deg,#8564e7,#6d4bd0)!important;color:#fff!important;box-shadow:0 7px 17px rgba(109,75,208,.18)}
      .primary-button:hover,.weight-link:hover,button[type=submit]:hover{background:#6240c2!important;transform:translateY(-1px)}
      .secondary-button{background:#f1edfa!important;color:#5d4a8f!important}
      input,select,textarea{border:1px solid #e5def2!important;border-radius:12px!important;background:#fcfbff!important;color:var(--ink)!important}
      input:focus,select:focus,textarea:focus{outline:none;border-color:#8a6be2!important;box-shadow:0 0 0 4px rgba(120,86,216,.13)!important}
      a{color:#6d4bd0}
      .week-day.active,.active,.selected{background:#7856d8!important;color:#fff!important;border-color:#7856d8!important}
      .highlight{background:#f0eaff!important;color:#6240c2!important}
      .user-stat{border-color:#ece8f5!important}
      table th{background:#f7f4fd!important;color:#675c80!important}
      @media(max-width:650px){body{padding:14px!important}.topbar{align-items:flex-start;flex-wrap:wrap}.top-actions{flex-wrap:wrap}}
    </style>

</head>
<body>
<main class="card">
    <h1>회원가입</h1>

    <form id="signupForm">
        <div class="form-group">
            <label for="signupEmail">아이디(이메일)</label>
            <input id="signupEmail" type="email" autocomplete="username" placeholder="예: qwer1234@foodvisior.com" required>
        </div>

        <div class="form-group">
            <label for="signupPassword">비밀번호</label>
            <input id="signupPassword" type="password" minlength="8"
                   autocomplete="new-password" placeholder="비밀번호는 영문, 숫자 조합 8자리 이상" required>
        </div>

        <div class="form-group">
            <label for="signupPasswordConfirm">비밀번호 확인</label>
            <input id="signupPasswordConfirm" type="password" minlength="8"
                   autocomplete="new-password" required>
        </div>

        <div class="form-group">
            <label for="signupName">이름</label>
            <input id="signupName" type="text" required>
        </div>

        <div class="form-group">
            <label for="signupGender">성별</label>
            <select id="signupGender" required>
                <option value="남">남성</option>
                <option value="여">여성</option>
            </select>
        </div>

        <div class="form-group">
            <label for="signupAge">나이</label>
            <input id="signupAge" type="number" min="1" max="120" required>
        </div>

        <div class="form-group">
            <label for="signupHeight">키(cm)</label>
            <input id="signupHeight" type="number" min="1" max="300"
                   step="0.1" required>
        </div>

        <div class="form-group">
            <label for="signupWeight">체중(kg)</label>
            <input id="signupWeight" type="number" min="1" max="500"
                   step="0.1" required>
        </div>

        <div class="form-group">
            <label for="signupActivity">주당 운동량</label>
            <select id="signupActivity">
                <option value="SEDENTARY">주 1회</option>
                <option value="LIGHTLY_ACTIVE">주 2회</option>
                <option value="MODERATELY_ACTIVE">주 3회</option>
                <option value="VERY_ACTIVE">주 4회</option>
                <option value="EXTRA_ACTIVE">주 5회</option>
            </select>
        </div>

        <div class="form-group">
            <label for="signupGoal">목표</label>
            <select id="signupGoal">
                <option value="체중감량">체중 감량</option>
                <option value="체중유지">체중 유지</option>
                <option value="근육량증가">근육량 증가</option>
            </select>
        </div>

        <div class="form-group">
            <label for="signupPreference">선호 음식</label>
            <select id="signupPreference">
                <option value="한식">한식</option>
                <option value="중식">중식</option>
                <option value="양식">양식</option>
                <option value="일식">일식</option>
                <option value="기타">기타</option>
            </select>
        </div>

        <div class="form-group">
            <label for="securityQuestion">본인 확인 질문</label>
            <select id="securityQuestion" required>
                <option value="">질문 선택</option>
                <option value="childhood_nickname">어릴 때 별명은?</option>
                <option value="first_school">처음 다닌 학교 이름은?</option>
                <option value="favorite_food">좋아하는 음식은?</option>
                <option value="impressive_travel">가장 기억나는 여행지는?</option>
                <option value="impressive_travel"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="securityAnswer">본인 확인 답변</label>
            <input id="securityAnswer" type="text" autocomplete="off" required>
        </div>

        <button type="submit">가입하기</button>
        <p class="message" id="signupMessage" role="status"></p>
    </form>

    <div class="link-row">
        <a href="login.html">로그인으로 돌아가기</a>
    </div>
</main>
    <script src="js/ui-effects.js" defer></script>
</body>
</html>
