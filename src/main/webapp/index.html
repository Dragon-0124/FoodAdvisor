<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7856d8">
  <title>FoodAdvisor | 식단 관리 앱</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root { --fa-violet:#7856d8; --fa-deep:#6240c2; --fa-ink:#29243a; --fa-muted:#827d91; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--fa-ink); background:radial-gradient(ellipse at 50% 25%, #eee7ff 0, transparent 42%), #faf9fd; }
    .landing { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 20px; text-align:center; }
    .brand { margin:0; font-size:clamp(48px, 8vw, 82px); line-height:1.1; letter-spacing:-4px; font-weight:850; color:var(--fa-ink); }
    .brand-accent { color:var(--fa-violet); }
    .tagline { margin:18px 0 0; color:var(--fa-muted); font-size:clamp(15px, 2vw, 19px); letter-spacing:.04em; }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:38px; }
    .action { display:inline-flex; align-items:center; justify-content:center; min-width:136px; min-height:48px; padding:13px 23px; border-radius:14px; font-size:15px; font-weight:750; text-decoration:none; transition:transform .15s ease, box-shadow .15s ease; }
    .action:hover { transform:translateY(-2px); }
    .login { color:#604b8f; background:#fff; border:1px solid #e7e0f5; }
    .signup { color:#fff; background:var(--fa-violet); box-shadow:0 8px 22px #7856d82b; }
    .footer { position:absolute; bottom:22px; color:#a09aac; font-size:12px; }
    @media(max-width:480px) { .brand { letter-spacing:-2.5px; } .actions { width:100%; } .action { flex:1; min-width:120px; } }
  </style>
</head>
<body>
  <main class="landing">
    <div class="brand" aria-label="FoodAdvisor"><span class="brand-accent">F</span>ood<span class="brand-accent">A</span>dvisor</div>
    <p class="tagline">식단 관리 앱</p>
    <nav class="actions" aria-label="계정 메뉴">
      <a class="action login" href="login.html">로그인</a>
      <a class="action signup" href="signup.html">회원가입</a>
    </nav>
    <footer class="footer">나의 식단을 더 쉽고 꾸준하게</footer>
  </main>
    <script src="js/ui-effects.js" defer></script>
</body>
</html>
