<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식단 관리 앱</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js" defer></script>

    <style>
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin: 32px auto;
            padding: 0 16px;
        }

        .digital-clock {
            color: #2c3e50;
            font-size: 32px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        .clock {
            position: relative;
            width: 220px;
            height: 220px;
            border: 8px solid #333;
            border-radius: 50%;
            background: white;
            box-shadow: 0 4px 10px #00000033;
        }

        .clock::after {
            position: absolute;
            z-index: 10;
            top: 50%;
            left: 50%;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #e74c3c;
            content: "";
            transform: translate(-50%, -50%);
        }

        .hand {
            position: absolute;
            z-index: 5;
            bottom: 50%;
            left: 50%;
            border-radius: 4px;
            background: #333;
            transform-origin: bottom;
        }

        .hour-hand {
            width: 6px;
            height: 60px;
            margin-left: -3px;
            background: #2c3e50;
        }

        .minute-hand {
            width: 4px;
            height: 85px;
            margin-left: -2px;
            background: #7f8c8d;
        }

        .second-hand {
            z-index: 6;
            width: 2px;
            height: 95px;
            margin-left: -1px;
            background: #e74c3c;
        }

        .number {
            position: absolute;
            top: 0;
            left: 0;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            padding-top: 10px;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        .number div {
            display: inline-block;
        }

        .num1 { transform: rotate(30deg); }
        .num1 div { transform: rotate(-30deg); }
        .num2 { transform: rotate(60deg); }
        .num2 div { transform: rotate(-60deg); }
        .num3 { transform: rotate(90deg); }
        .num3 div { transform: rotate(-90deg); }
        .num4 { transform: rotate(120deg); }
        .num4 div { transform: rotate(-120deg); }
        .num5 { transform: rotate(150deg); }
        .num5 div { transform: rotate(-150deg); }
        .num6 { transform: rotate(180deg); }
        .num6 div { transform: rotate(-180deg); }
        .num7 { transform: rotate(210deg); }
        .num7 div { transform: rotate(-210deg); }
        .num8 { transform: rotate(240deg); }
        .num8 div { transform: rotate(-240deg); }
        .num9 { transform: rotate(270deg); }
        .num9 div { transform: rotate(-270deg); }
        .num10 { transform: rotate(300deg); }
        .num10 div { transform: rotate(-300deg); }
        .num11 { transform: rotate(330deg); }
        .num11 div { transform: rotate(-330deg); }

        .user-card,
        .diet-card {
            width: min(100%, 560px);
            margin-top: 12px;
            padding: 24px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 15px #0000001a;
        }

        .user-card h1,
        .diet-card h2 {
            margin-top: 0;
            text-align: center;
        }

        .user-stat {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .highlight {
            margin-top: 16px;
            color: #27ae60;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }

        .weight-link {
            display: block;
            margin: 20px 0;
            padding: 12px;
            border-radius: 8px;
            background: #16a085;
            color: white;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
        }

        .weight-link:hover {
            background: #138d75;
        }

        .diet-row {
            display: flex;
            gap: 10px;
        }

        .diet-row .form-group {
            flex: 1;
            min-width: 0;
        }

        .message {
            min-height: 22px;
            margin-top: 12px;
        }

        .nutrition-preview {
            margin: 12px 0 20px;
            padding: 16px;
            border-radius: 8px;
            background: #f5f8fa;
        }

        .nutrition-preview h3 {
            margin: 0 0 14px;
            font-size: 16px;
        }

        @media (max-width: 520px) {
            .diet-row {
                flex-direction: column;
            }

            .user-card,
            .diet-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
<main class="main-container">
    <section class="user-card" id="loggedOutView">
        <h1>식단 관리 앱</h1>
        <p class="muted">로그인하거나 새 계정을 만들어 시작하세요.</p>
        <div class="link-row">
            <a class="button-link" href="login.html">로그인</a>
            <a class="button-link secondary" href="signup.html">회원가입</a>
        </div>
    </section>

    <div class="digital-clock" id="digitalClock">오전 12:00:00</div>

    <div class="clock" aria-label="현재 시각 아날로그 시계">
        <div class="number num1"><div>1</div></div>
        <div class="number num2"><div>2</div></div>
        <div class="number num3"><div>3</div></div>
        <div class="number num4"><div>4</div></div>
        <div class="number num5"><div>5</div></div>
        <div class="number num6"><div>6</div></div>
        <div class="number num7"><div>7</div></div>
        <div class="number num8"><div>8</div></div>
        <div class="number num9"><div>9</div></div>
        <div class="number num10"><div>10</div></div>
        <div class="number num11"><div>11</div></div>
        <div class="number num12"><div>12</div></div>

        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand"></div>
    </div>

    <section class="user-card" id="loggedInView" hidden>
        <h1 id="welcomeText">환영합니다</h1>

        <div class="user-stat">
            <span>성별 / 나이</span>
            <strong id="profileDemographics"></strong>
        </div>
        <div class="user-stat">
            <span>신체 정보</span>
            <strong id="profileBody"></strong>
        </div>
        <div class="user-stat">
            <span>목표</span>
            <strong id="profileGoal"></strong>
        </div>
        <div class="user-stat">
            <span>선호 음식</span>
            <strong id="profilePreference"></strong>
        </div>
        <div class="highlight" id="profileCalories"></div>

        <a class="weight-link" href="weight-tracker.html">
            체중 변화 그래프 보기
        </a>

        <button type="button" id="logoutButton">로그아웃</button>

        <section class="diet-card">
            <h2>오늘 먹은 식단 기록</h2>

            <div class="form-group">
                <label for="dietDate">날짜</label>
                <input type="date" id="dietDate">
            </div>

            <div class="diet-row">
                <div class="form-group">
                    <label for="dietMealType">식사 구분</label>
                    <select id="dietMealType">
                        <option value="아침">아침</option>
                        <option value="점심">점심</option>
                        <option value="저녁">저녁</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="foodSearch">음식 검색</label>
                    <input id="foodSearch" type="search" maxlength="50"
                           placeholder="음식 이름을 입력하세요">
                    <button type="button" id="searchFoodButton">음식 검색</button>
                    <select id="dietFoodId" aria-label="검색된 음식" disabled>
                        <option value="">먼저 음식을 검색해 주세요</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dietPortion">섭취량</label>
                    <select id="dietPortion">
                        <option value="0.5">0.5인분</option>
                        <option value="1" selected>1인분</option>
                        <option value="2">2인분</option>
                    </select>
                </div>
            </div>

            <section class="nutrition-preview" aria-live="polite" aria-atomic="true">
                <h3 id="nutritionFoodName">음식을 선택하면 영양 정보를 확인할 수 있습니다</h3>
                <div class="user-stat"><span>칼로리</span><strong id="nutritionCalories">-</strong></div>
                <div class="user-stat"><span>탄수화물</span><strong id="nutritionCarbs">-</strong></div>
                <div class="user-stat"><span>단백질</span><strong id="nutritionProtein">-</strong></div>
                <div class="user-stat"><span>지방</span><strong id="nutritionFat">-</strong></div>
                <div class="user-stat"><span>당</span><strong id="nutritionSugar">-</strong></div>
            </section>

            <button type="button" id="recordDietButton">식단 저장하기</button>
            <p class="message" id="dietMessage" role="status"></p>
        </section>
    </section>
</main>

<script>
    function updateClock() {
        const now = new Date();
        const hours = now.getHours();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();

        const ampm = hours >= 12 ? "오후" : "오전";
        const displayHour = hours % 12 || 12;
        const hh = String(displayHour).padStart(2, "0");
        const mm = String(minutes).padStart(2, "0");
        const ss = String(seconds).padStart(2, "0");

        document.getElementById("digitalClock").textContent =
            `${ampm} ${hh}:${mm}:${ss}`;

        document.getElementById("secondHand").style.transform =
            `rotate(${seconds * 6}deg)`;
        document.getElementById("minuteHand").style.transform =
            `rotate(${minutes * 6 + seconds * 0.1}deg)`;
        document.getElementById("hourHand").style.transform =
            `rotate(${(hours % 12) * 30 + minutes * 0.5}deg)`;
    }

    updateClock();
    setInterval(updateClock, 1000);

    function localDateString(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
    }

    document.getElementById("dietDate").value = localDateString();

    const foodSearchEl = document.getElementById("foodSearch");
    const foodSelectEl = document.getElementById("dietFoodId");
    const portionSelectEl = document.getElementById("dietPortion");

    function formatNutrient(value, unit) {
        const rounded = Math.round(value * 10) / 10;
        return `${Number.isInteger(rounded) ? rounded : rounded.toFixed(1)} ${unit}`;
    }

    function clearNutritionPreview() {
        document.getElementById("nutritionFoodName").textContent =
            "음식을 선택하면 영양 정보를 확인할 수 있습니다";
        ["Calories", "Carbs", "Protein", "Fat", "Sugar"].forEach(nutrient => {
            document.getElementById(`nutrition${nutrient}`).textContent = "-";
        });
    }

    function updateNutritionPreview() {
        const selectedFood = foodSelectEl.selectedOptions[0];
        if (!foodSelectEl.value || !selectedFood) {
            clearNutritionPreview();
            return;
        }

        const portion = Number(portionSelectEl.value);
        const nutrients = {
            Calories: [Number(selectedFood.dataset.calories), "kcal"],
            Carbs: [Number(selectedFood.dataset.carbs), "g"],
            Protein: [Number(selectedFood.dataset.protein), "g"],
            Fat: [Number(selectedFood.dataset.fat), "g"],
            Sugar: [Number(selectedFood.dataset.sugar), "g"]
        };

        document.getElementById("nutritionFoodName").textContent =
            `${selectedFood.textContent} · ${portion}인분`;
        Object.entries(nutrients).forEach(([name, [amount, unit]]) => {
            document.getElementById(`nutrition${name}`).textContent =
                formatNutrient(amount * portion, unit);
        });
    }

    async function searchFoods() {
        const keyword = foodSearchEl.value.trim();
        const messageEl = document.getElementById("dietMessage");
        if (!keyword) {
            messageEl.textContent = "검색할 음식 이름을 입력해 주세요.";
            messageEl.style.color = "#c0392b";
            foodSearchEl.focus();
            return;
        }

        const searchButton = document.getElementById("searchFoodButton");
        searchButton.disabled = true;
        messageEl.textContent = "음식 정보를 불러오는 중입니다.";
        messageEl.style.color = "#607d8b";
        foodSelectEl.disabled = true;
        foodSelectEl.replaceChildren(new Option("검색 중...", ""));
        clearNutritionPreview();

        try {
            const response = await fetch(
                `api/foods?keyword=${encodeURIComponent(keyword)}`,
                { headers: { Accept: "application/json" } }
            );
            const result = await response.json();
            if (!response.ok) {
                throw new Error(result.error || "음식 검색에 실패했습니다.");
            }

            foodSelectEl.replaceChildren();
            if (result.length === 0) {
                foodSelectEl.add(new Option("검색 결과가 없습니다", ""));
                messageEl.textContent = "검색 결과가 없습니다. 다른 음식 이름을 입력해 주세요.";
                messageEl.style.color = "#c0392b";
                return;
            }

            foodSelectEl.add(new Option("음식을 선택해 주세요", ""));
            result.forEach(food => {
                const option = new Option(food.name, food.foodId);
                option.dataset.calories = food.avgCalories;
                option.dataset.carbs = food.carbs_g;
                option.dataset.protein = food.protein_g;
                option.dataset.fat = food.fat_g;
                option.dataset.sugar = food.sugar_g;
                foodSelectEl.add(option);
            });
            foodSelectEl.disabled = false;
            messageEl.textContent = `${result.length}개의 음식을 찾았습니다.`;
            messageEl.style.color = "#16856f";
        } catch (error) {
            foodSelectEl.replaceChildren(new Option("음식을 검색해 주세요", ""));
            messageEl.textContent = error.message || "음식 정보를 불러오지 못했습니다.";
            messageEl.style.color = "#c0392b";
        } finally {
            searchButton.disabled = false;
        }
    }

    document.getElementById("searchFoodButton").addEventListener("click", searchFoods);
    foodSearchEl.addEventListener("keydown", event => {
        if (event.key === "Enter") {
            event.preventDefault();
            searchFoods();
        }
    });
    foodSelectEl.addEventListener("change", updateNutritionPreview);
    portionSelectEl.addEventListener("change", updateNutritionPreview);

    function recordDiet(event) {
        if (event) event.preventDefault();

        // 1. 로컬 세션 검증
        let session;
        try {
            session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
        } catch {
            session = null;
        }

        if (!session || Date.now() >= session.expiresAt) {
            alert("로그인이 필요합니다.");
            localStorage.removeItem(SESSION_KEY);
            renderMainPage();
            return;
        }

        // 2. 입력 데이터 가져오기
        const dateEl = document.getElementById('dietDate');
        const mealTypeEl = document.getElementById('dietMealType');
        const foodIdEl = document.getElementById('dietFoodId');
        const portionEl = document.getElementById('dietPortion');

        if (!dateEl || !mealTypeEl || !foodIdEl || !portionEl) {
            alert("식단 입력 양식을 찾을 수 없습니다.");
            return;
        }

        const payload = {
            email: session.email,
            recordDate: dateEl.value,
            mealType: mealTypeEl.value,
            foodId: parseInt(foodIdEl.value),
            portion: parseFloat(portionEl.value),
            createdAt: Date.now()
        };

        // 3. 로컬 스토리지에 식단 배열로 저장
        try {
            const diets = JSON.parse(localStorage.getItem(DIETS_KEY) || "[]");
            diets.push(payload);
            localStorage.setItem(DIETS_KEY, JSON.stringify(diets));
            
            alert('✅ 성공적으로 내 DB(로컬 스토리지)에 식단이 저장되었습니다!');
            
            // (선택) 저장 후 입력창 초기화
            foodIdEl.value = "";
            portionEl.value = "";
        } catch (error) {
            alert("식단 기록 중 오류가 발생했습니다.");
        }
    }

    document.getElementById("recordDietButton")
        .addEventListener("click", recordDiet);
</script>
</body>
</html>
